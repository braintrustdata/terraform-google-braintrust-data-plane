[tools]
tflint = "latest"
pre-commit = "latest"
terraform = "1.15.8"
uv = "latest"

[tasks]
lint = ["terraform fmt -recursive", "tflint --recursive"]
setup = ["pre-commit install", "tflint --init"]
test = ["terraform test", "terraform -chdir=modules/byoc-bootstrap test", "terraform -chdir=examples/byoc-bootstrap test", "python3 -B -m unittest discover -s modules/byoc-bootstrap/tests -p 'test_*.py' -v"]
precommit = ["pre-commit run --all-files"]

[tasks.validate]
description = "Validate the Terraform modules and examples"
run = """
#!/usr/bin/env bash
set -e
echo "Validating module"
terraform init
terraform validate

for example_dir in examples/braintrust-data-plane examples/braintrust-data-plane-gke-standard; do
  (
    echo "Validating $example_dir"
    cd "$example_dir"
    # Use the local module for example validation.
    trap 'rm -f main_override.tf' EXIT
    cat <<EOF> main_override.tf
module "braintrust-data-plane" {
  source = "../../"
}
EOF
    terraform init -backend=false
    terraform validate
  )
done

for bootstrap_dir in modules/byoc-bootstrap examples/byoc-bootstrap; do
  terraform -chdir="$bootstrap_dir" init -backend=false -input=false
  terraform -chdir="$bootstrap_dir" validate
done
"""
